# Pipeline de données : une seule commande -> `dvc repro` (ou `make pipeline`)
stages:
  ingest_hateful_memes:
    cmd: python -m src.ingestion.kaggle_source hateful_memes
    deps: [src/ingestion/kaggle_source.py]
    params: [{configs/params.yaml: [ingestion.kaggle.hateful_memes]}]
    outs: [data/raw/hateful_memes]

  ingest_sentiment140:
    cmd: python -m src.ingestion.kaggle_source sentiment140
    deps: [src/ingestion/kaggle_source.py]
    params: [{configs/params.yaml: [ingestion.kaggle.sentiment140]}]
    outs: [data/raw/sentiment140]

  # ingest_reddit:   # optionnel (identifiants API requis) ; persist car la collecte n'est pas déterministe
  #   cmd: python -m src.ingestion.reddit_source
  #   outs: [{data/raw/reddit: {persist: true}}]

  preprocess:
    cmd: python -m src.preprocessing.run
    deps: [data/raw/hateful_memes, data/raw/sentiment140, src/preprocessing, src/validation, src/common]
    params: [{configs/params.yaml: [seed, preprocessing]}]
    outs: [data/interim/clean.parquet, data/logs/preprocess.json, data/logs/preprocess_rejects.csv]

  align:
    cmd: python -m src.alignment.dedup_groups
    deps: [data/interim/clean.parquet, src/alignment/dedup_groups.py]
    params: [{configs/params.yaml: [seed, alignment]}]
    outs: [data/interim/aligned.parquet, data/logs/align.json, data/logs/align_rejects.csv]

  split:
    cmd: python -m src.alignment.split
    deps: [data/interim/aligned.parquet, src/alignment/split.py]
    params: [{configs/params.yaml: [seed, split]}]
    outs: [data/interim/split.parquet]

  build_manifest:
    cmd: python -m src.export.manifest
    deps: [data/interim/split.parquet, data/logs/preprocess.json, data/logs/preprocess_rejects.csv,
           data/logs/align.json, data/logs/align_rejects.csv, src/export/manifest.py, src/validation/schemas.py]
    outs: [data/processed/manifest.parquet, data/logs/rejects.csv, data/logs/counters.csv, data/logs/run_summary.json]

  quality_gate:            # échoue (code 1) si un contrôle critique échoue : le pipeline s'arrête
    cmd: python -m src.validation.quality_gate
    deps: [data/processed/manifest.parquet, data/logs/rejects.csv, data/logs/counters.csv, data/raw/hateful_memes,
           src/validation/quality_gate.py, src/validation/labels.py]
    params: [{configs/params.yaml: [quality]}]
    outs: [reports/quality_tests.csv]
    metrics: [{reports/quality.json: {cache: false}}]

  report:
    cmd: python -m src.reporting.data_report
    deps: [data/processed/manifest.parquet, data/logs/counters.csv, reports/quality_tests.csv, src/reporting/data_report.py]
    outs: [reports/data_report.html, reports/stats_summary.csv, reports/label_mapping.csv]

  # --- Étapes à brancher (Partie B), modules dans src/fusion/ ---
  # extract_features:      # CLIP : tokens image [N,50,768] et texte [N,m,512] en fp16, mis en cache (calculés une seule fois)
  #   cmd: python -m src.fusion.extract_features
  #   deps: [data/processed/manifest.parquet, src/fusion/encoders.py]
  #   params: [{configs/params.yaml: [fusion.encoder]}]
  #   outs: [data/processed/features]
  # train_fusion:          # suivi MLflow (src/fusion/tracking.py), 5 graines
  #   cmd: python -m src.fusion.train
  #   deps: [data/processed/features, src/fusion/model.py]
  #   params: [{configs/params.yaml: [seed, fusion]}]
  #   outs: [models/fusion.pt]
  #   metrics: [{reports/metrics.json: {cache: false}}]
  # evaluate:              # AUROC, F1, ablations, contribution des modalités
  #   cmd: python -m src.fusion.evaluate
